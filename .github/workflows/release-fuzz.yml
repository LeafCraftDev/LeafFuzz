name: Release LeafFuzz to GitHub Releases

# Multi-product monorepo release pipeline for LeafFuzz (ADR-126, leaffuzz-ADR-001):
#   - Publishes distinct LeafFuzz releases from LeafCraftDev/LeafFuzz (or the
#     monorepo) using component-prefixed tags (`leaffuzz-v<semver>` / `fuzz-v<semver>`).
#   - Explicitly sets `make_latest: false` when triggered inside a multi-product
#     monorepo so `/releases/latest` on DailyStruggle/RTP remains pinned to LeafRTP.
#   - Reads version from `resource/LeafFuzz/leaffuzz-plugin/build.gradle` and
#     release notes from `resource/LeafFuzz/CHANGELOG.md` (if present).
#   - Signs deliverables with the repository PGP key (`SIGNING_KEY`), attaches
#     `.sha256` and `.sha512` checksums, and generates GitHub SLSA build provenance.

on:
  push:
    tags:
      - 'leaffuzz-v*.*.*'
      - 'fuzz-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'LeafFuzz version string to release (e.g. 0.1.0). If omitted, read from resource/LeafFuzz/leaffuzz-plugin/build.gradle.'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Determine release version and tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            TAG="leaffuzz-v${VERSION}"
          elif [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" =~ ^(leaffuzz|fuzz)-[vV]([0-9]+\.[0-9]+.*)$ ]]; then
            VERSION="${BASH_REMATCH[2]}"
            TAG="$REF_NAME"
          else
            VERSION=$(grep -E "^version\s*=\s*['\"]" resource/LeafFuzz/leaffuzz-plugin/build.gradle | head -n 1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/" | tr -d '[:space:]')
            TAG="leaffuzz-v${VERSION}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine LeafFuzz release version."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
            echo "::error::Invalid LeafFuzz release version format: ${VERSION}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing LeafFuzz version: ${VERSION} (tag ${TAG})"

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and validate LeafFuzz storefront pages (ADR-130)
        run: python3 scripts/release/build_front_pages.py --product leaffuzz

      - name: Build LeafFuzz jar + checksums + signing
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :resource:LeafFuzz:leaffuzz-common:check :resource:LeafFuzz:leaffuzz-paper:check :resource:LeafFuzz:leaffuzz-plugin:build :resource:LeafFuzz:leaffuzz-plugin:generateChecksums :resource:LeafFuzz:leaffuzz-plugin:signDeliverables

      - name: Locate LeafFuzz jar and release deliverables
        id: artifact
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          FUZZ_JAR=$(find resource/LeafFuzz/leaffuzz-plugin/build/libs -maxdepth 1 -type f -name 'LeafFuzz-*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          if [ -z "$FUZZ_JAR" ] || [ ! -f "$FUZZ_JAR" ]; then
            echo "::error::Could not locate LeafFuzz jar under resource/LeafFuzz/leaffuzz-plugin/build/libs/"
            ls -la resource/LeafFuzz/leaffuzz-plugin/build/libs/ || true
            exit 1
          fi
          echo "jar=${FUZZ_JAR}" >> "$GITHUB_OUTPUT"
          echo "Found LeafFuzz jar: ${FUZZ_JAR}"

          if [ -f "${FUZZ_JAR}.asc" ]; then
            echo "asc=${FUZZ_JAR}.asc" >> "$GITHUB_OUTPUT"
            echo "Found PGP signature: ${FUZZ_JAR}.asc"
          elif [ -n "$SIGNING_KEY" ]; then
            echo "::error::Missing PGP signature ${FUZZ_JAR}.asc despite SIGNING_KEY being configured."
            exit 1
          fi

      - name: Extract release notes from resource/LeafFuzz/CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHANGELOG_FILE="resource/LeafFuzz/CHANGELOG.md"
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "::warning::${CHANGELOG_FILE} not found; falling back to generic release notes."
            echo "LeafFuzz ${VERSION}" > release-notes-fuzz.md
          else
            awk -v ver="$VERSION" '
              BEGIN { capture = 0 }
              /^## \[/ {
                if (capture) { exit }
                if (index($0, "[" ver "]") > 0) { capture = 1; next }
              }
              /^\[[0-9]+\.[0-9]+/ {
                if (capture) { exit }
              }
              capture == 1 { print }
            ' "$CHANGELOG_FILE" > release-notes-fuzz.md

            if [ ! -s release-notes-fuzz.md ]; then
              awk '
                BEGIN { capture = 0 }
                /^## \[Unreleased\]/ { capture = 1; next }
                /^## \[/ { if (capture) { exit } }
                capture == 1 { print }
              ' "$CHANGELOG_FILE" > release-notes-fuzz.md
            fi

            if [ ! -s release-notes-fuzz.md ]; then
              echo "::warning::No matching section in ${CHANGELOG_FILE} for [${VERSION}]; using placeholder."
              echo "LeafFuzz ${VERSION}" > release-notes-fuzz.md
            fi
          fi
          echo "--- release-notes-fuzz.md ---"
          cat release-notes-fuzz.md
          echo "--- end ---"

      - name: Generate SLSA Build Provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.artifact.outputs.jar }}

      - name: Create and push Git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
            || [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "Tag ${TAG} already exists locally or remotely. Skipping tag creation."
          else
            echo "Creating and pushing tag ${TAG}..."
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release (ADR-126)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LeafFuzz ${{ steps.version.outputs.version }}${{ startsWith(steps.version.outputs.version, '0.1.') && ' (Beta 1)' || '' }}
          body_path: release-notes-fuzz.md
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
          make_latest: false
          files: |
            ${{ steps.artifact.outputs.jar }}
            ${{ steps.artifact.outputs.jar }}.sha256
            ${{ steps.artifact.outputs.jar }}.sha512
            ${{ steps.artifact.outputs.asc }}
