plugins {
    id 'net.fabricmc.fabric-loom'
}

group = 'net.leaf'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'

    implementation project(':resource:LeafFuzz:leaffuzz-common')
    implementation(project(':fabric:fabric-common-unobf')) { transitive = false }
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.143.5+26.1'
    compileOnly 'com.mojang:brigadier:1.3.10'
}
