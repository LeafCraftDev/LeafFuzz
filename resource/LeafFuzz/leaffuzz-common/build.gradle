plugins {
    id 'java-library'
}

group = 'net.leaf'
version = '0.1.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    maven {
        name = 'Minecraft Libraries'
        url = 'https://libraries.minecraft.net/'
    }
}

dependencies {
    api project(':server-api')
    api project(':yaml-api')
    api project(':units-api')
    api project(':bit-api')
    api project(':config-bit-api')
    api project(':bytecode-api')
    api project(':commands-api')
    api project(':menu-api')
    api project(':effects-api')
    api project(':predict-api')
    api project(':helpers:stresstest-core')
    compileOnly 'com.mojang:brigadier:1.2.9'

    testImplementation 'com.mojang:brigadier:1.2.9'
    testImplementation rootProject.libs.jqwik
    testImplementation rootProject.libs.jazzer.junit
}

test {
    useJUnitPlatform {
        includeEngines 'junit-jupiter', 'jqwik'
    }
}
