name: LeafFuzz
version: 0.1.1
main: net.leaf.fuzz.paper.PaperLeafFuzzPlugin
api-version: '1.21'
folia-supported: true
description: Cross-platform in-JVM QC, command-tree fuzzing, and post-GC memory leak screener (Paper/Folia).
